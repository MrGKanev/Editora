name: Build & Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win32

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and make (macOS)
        if: matrix.platform == 'darwin'
        run: npm run make -- --platform darwin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and make (Linux)
        if: matrix.platform == 'linux'
        run: npm run make -- --platform linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and make (Windows)
        if: matrix.platform == 'win32'
        run: npm run make -- --platform win32
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: editora-${{ matrix.platform }}
          path: out/make/**/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -50

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          body: |
            ## macOS — "damaged and can't be opened"

            Editora is not code-signed, so macOS Gatekeeper may block it on first launch. It is **not** damaged.

            **Option 1 — Right-click to open:**
            Right-click `Editora.app` → **Open** → **Open**. macOS remembers this choice.

            **Option 2 — Terminal:**
            ```bash
            xattr -rd com.apple.quarantine /Applications/Editora.app
            ```
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.deb
            artifacts/**/*.exe
            artifacts/**/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
